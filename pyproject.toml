[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.8"]
build-backend = "hatchling.build"

[project]
name = "anywidget-instruments-industrial"
version = "0.1.0.dev0"
description = "Instrumentation widgets (knobs, gauges, LEDs, tanks, strip charts, alarms) for computational notebooks, built on anywidget."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sébastien Celles" }]
keywords = ["anywidget", "jupyter", "marimo", "instrumentation", "hmi", "scada", "widgets"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
# The widgets derive from the anywidget-instruments core. It is not on the
# package index yet: install it first from its repository, at the commit the
# front end is built against (package.json), as the CI workflow does.
dependencies = ["anywidget-instruments", "anywidget>=0.9", "traitlets>=5.9", "numpy>=1.23"]

[project.optional-dependencies]
units = ["pint>=0.22"]
dev = ["pytest>=8", "pytest-cov", "jsonschema>=4.18", "ruff>=0.6", "mypy>=1.10", "pint>=0.22", "jupyterlab>=4", "notebook>=7", "marimo"]

docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "jupyter-server>=2",
  "jupyterlite-core>=0.4",
  "jupyterlite-pyodide-kernel>=0.4",
  "marimo>=0.14",
]

[project.urls]
Homepage = "https://github.com/AnywidgetInstruments/anywidget-instruments-industrial"
Issues = "https://github.com/AnywidgetInstruments/anywidget-instruments-industrial/issues"
Specification = "https://anywidgetinstruments.github.io/anywidget-instruments-industrial/specification/"

[tool.hatch.build]
only-packages = true
# data directories are not Python packages: only-packages would leave them out
artifacts = [
  "src/anywidget_instruments_industrial/static/*",
  "src/anywidget_instruments_industrial/schema/*.json",
  "src/anywidget_instruments_industrial/templates/*.svg",
]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "src/anywidget_instruments_industrial/static/index.js",
  "src/anywidget_instruments_industrial/static/index.css",
  "src/anywidget_instruments_industrial/static/contract.json",
]
skip-if-exists = ["src/anywidget_instruments_industrial/static/index.js"]
dependencies = ["hatch-jupyter-builder>=0.8"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = ["npm"]
build_cmd = "build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["e2e/notebooks", "e2e/marimo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# marimo displays the last expression of a cell
"lite/marimo/*.py" = ["B018"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
