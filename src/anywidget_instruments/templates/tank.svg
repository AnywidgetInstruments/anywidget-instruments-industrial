<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 200 220" font-family="sans-serif">
  <!-- anywidget-instruments SvgPanel template: tank with level, high alarm lamp and fill / drain push buttons; value is the level in %.
       Roles are in the inkscape:label attributes (awi:<role>=<name>;<option>=<value>). -->
  <rect x="4" y="4" width="192" height="212" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2" inkscape:label="plate"/>
  <rect x="30" y="24" width="80" height="150" rx="10" fill="#ffffff" stroke="#374151" stroke-width="3" inkscape:label="vessel"/>
  <rect x="33" y="27" width="74" height="144" rx="8" fill="#3b82f6" fill-opacity="0.8" inkscape:label="awi:scale=value;min=0;max=100;edge=bottom"/>
  <line x1="24" y1="56" x2="116" y2="56" stroke="#dc2626" stroke-dasharray="4 3" inkscape:label="high mark"/>
  <text x="70" y="196" font-size="13" font-family="monospace" text-anchor="middle" fill="#111827" inkscape:label="awi:text=value;format=%.0f;unit=%">0 %</text>
  <circle cx="155" cy="44" r="12" fill="#374151" stroke="#111827" inkscape:label="awi:color=high;on=#dc2626;off=#374151"/>
  <text x="155" y="70" font-size="10" text-anchor="middle" fill="#111827">HIGH</text>
  <rect x="128" y="96" width="54" height="26" rx="5" fill="#16a34a" stroke="#14532d" inkscape:label="awi:momentary=fill;label=Fill"/>
  <text x="155" y="113" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">FILL</text>
  <rect x="128" y="134" width="54" height="26" rx="5" fill="#6b7280" stroke="#374151" inkscape:label="awi:momentary=drain;label=Drain"/>
  <text x="155" y="151" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">DRAIN</text>
</svg>
