<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 120 150" font-family="sans-serif">
  <!-- anywidget-instruments SvgPanel template: pilot lamp with a push-to-test lens; value is a Boolean, caption a text.
       Roles are in the inkscape:label attributes (awi:<role>=<name>;<option>=<value>). -->
  <rect x="6" y="6" width="108" height="138" rx="8" fill="#d1d5db" stroke="#4b5563" stroke-width="2" inkscape:label="plate"/>
  <circle cx="60" cy="58" r="40" fill="#6b7280" stroke="#374151" stroke-width="3" inkscape:label="bezel"/>
  <circle cx="60" cy="58" r="31" fill="#374151" stroke="#111827" inkscape:label="awi:color=value;on=#22c55e;off=#374151"/>
  <circle cx="60" cy="58" r="31" fill="#ffffff" fill-opacity="0" stroke="none" inkscape:label="awi:button=value;label=Lamp"/>
  <ellipse cx="50" cy="46" rx="10" ry="6" fill="#ffffff" fill-opacity="0.35" inkscape:label="reflection"/>
  <g inkscape:label="awi:state=value">
    <text x="60" y="113" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" inkscape:label="awi:case=true">ON</text>
    <text x="60" y="113" font-size="13" text-anchor="middle" fill="#4b5563" inkscape:label="awi:case=false">OFF</text>
  </g>
  <text x="60" y="133" font-size="11" text-anchor="middle" fill="#1f2937" inkscape:label="awi:text=caption">Running</text>
</svg>
