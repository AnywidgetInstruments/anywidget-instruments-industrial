<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 180 170" font-family="sans-serif">
  <!-- anywidget-instruments-industrial SvgPanel template: three-position selector OFF / HAND / AUTO; value is 0, 1 or 2.
       Roles are in the inkscape:label attributes (awi:<role>=<name>;<option>=<value>). -->
  <rect x="6" y="6" width="168" height="158" rx="8" fill="#d1d5db" stroke="#4b5563" stroke-width="2" inkscape:label="plate"/>
  <text x="38" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" inkscape:label="awi:set=value;value=0;label=OFF">OFF</text>
  <text x="90" y="32" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" inkscape:label="awi:set=value;value=1;label=HAND">HAND</text>
  <text x="142" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" inkscape:label="awi:set=value;value=2;label=AUTO">AUTO</text>
  <circle cx="90" cy="100" r="44" fill="#1f2937" stroke="#111827" stroke-width="3" inkscape:label="body"/>
  <g inkscape:label="awi:rotate=value;min=0;max=2;from=-50;to=50;cx=90;cy=100">
    <rect x="80" y="58" width="20" height="84" rx="8" fill="#374151" stroke="#9ca3af"/>
    <path d="M90 62L96 76H84Z" fill="#f9fafb"/>
  </g>
  <text x="90" y="160" font-size="11" text-anchor="middle" fill="#1f2937" inkscape:label="awi:text=mode">MODE</text>
</svg>
