for (const s of specs) {

  widget.render({ model: m, el });

    m.emit("msg:custom", { type: "snapshot", n }, [new DataView(v.buffer)]);
  }

    // fixed times (UTC 08:00) for reproducible screenshots
    const n = 121, t0 = 1767254400, ts = new Float64Array(n), lv = new Float32Array(n), fl = new Float32Array(n);
    for (let i = 0; i < n; i++) { ts[i] = t0 + 5 * i; lv[i] = 2 + 0.8 * Math.sin(i / 15) + 0.05 * rand(); fl[i] = 25 + 10 * Math.cos(i / 22); }

    const n = 600;
    const rows = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) { rows[2 * i] = Math.sin(i / 20); rows[2 * i + 1] = Math.cos(i / 35) + (rand() - 0.5) * 0.2; }
    m.emit("msg:custom", { type: "append", n_points: n, total: n }, [new DataView(rows.buffer)]);
  }
}
