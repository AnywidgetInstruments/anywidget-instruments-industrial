# Documentation site (DOC-001, DOC-005) with in-browser deployments (DOC-006):
# JupyterLite and a marimo WebAssembly export, published to GitHub Pages.
name: Docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build uv -e ".[docs]" # uv: import analysis of the marimo export
      - run: python -m build --wheel -o dist
      - name: MkDocs (offline-capable, strict)
        run: mkdocs build --strict -d site
      - name: JupyterLite with the package wheel
        working-directory: lite
        run: jupyter lite build --contents content --piplite-wheels ../dist/*.whl --output-dir ../site/lite
      - name: marimo WebAssembly export with the package wheel
        run: |
          mkdir -p lite/marimo/public
          cp dist/*.whl lite/marimo/public/
          (cd dist && ls *.whl) > lite/marimo/public/wheel.txt
          marimo export html-wasm lite/marimo/instruments.py -o site/marimo --mode run --show-code
          rm -f site/marimo/CLAUDE.md
      - name: In-browser deployments work (DOC-006)
        run: |
          npx playwright install --with-deps chromium
          npm run test:site -- --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Published from pushes to main (Settings > Pages > Source: GitHub Actions).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
