# Documentation site (DOC-001, DOC-005) with in-browser deployments (DOC-006):
# JupyterLite and a marimo WebAssembly export, published to GitHub Pages.
name: Docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The anywidget-instruments core, at the commit of package.json (not on the package index yet)
        run: pip install "anywidget-instruments @ git+https://github.com/AnywidgetInstruments/anywidget-instruments@$(node -p "require('./package.json').devDependencies['anywidget-instruments'].split('#')[1]")"
      - run: pip install build uv -e ".[docs]" # uv: import analysis of the marimo export
      - run: python -m build --wheel -o dist
      - name: Wheel of the anywidget-instruments core, at the commit of package.json
        run: |
          sha=$(node -p "require('./package.json').devDependencies['anywidget-instruments'].split('#')[1]")
          pip wheel --no-deps -w dist "anywidget-instruments @ git+https://github.com/AnywidgetInstruments/anywidget-instruments@$sha"
      - name: The wheel ships the bundle, the contract, the schemas and the SVG templates
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/anywidget_instruments_industrial-*.whl")[0]).namelist()
          for needed in ("static/index.js", "static/contract.json", "schema/knob.schema.json", "templates/voltmeter.svg"):
              assert any(n.endswith("anywidget_instruments_industrial/" + needed) for n in names), needed
          PY
      - name: MkDocs (offline-capable, strict)
        run: mkdocs build --strict -d site
      - name: JupyterLite with the package wheel
        working-directory: lite
        run: jupyter lite build --contents content --piplite-wheels ../dist/anywidget_instruments-*.whl --piplite-wheels ../dist/anywidget_instruments_industrial-*.whl --output-dir ../site/lite
      - name: marimo WebAssembly exports with the package wheel
        run: |
          mkdir -p lite/marimo/public
          cp dist/*.whl lite/marimo/public/
          # the core first: the library depends on it
          (cd dist && ls anywidget_instruments-*.whl anywidget_instruments_industrial-*.whl) > lite/marimo/public/wheel.txt
          for nb in lite/marimo/*.py; do
            name=$(basename "$nb" .py)
            marimo export html-wasm "$nb" -o "site/marimo/$name" --mode run --show-code
            rm -f "site/marimo/$name/CLAUDE.md"
          done
          # former single-notebook address
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=gallery/">\n' > site/marimo/index.html
      - name: In-browser deployments work (DOC-006)
        run: |
          npx playwright install --with-deps chromium
          npm run test:site -- --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Published from pushes to main (Settings > Pages > Source: GitHub Actions).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
