site_name: anywidget-instruments
site_description: Instrumentation widgets for computational notebooks
site_url: https://s-celles.github.io/anywidget-instruments/
repo_url: https://github.com/s-celles/anywidget-instruments
edit_uri: ""
# DOC-005: buildable offline — no Google Fonts, no CDN assets.
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
  # System preference by default; the toggle cycles light, dark, system.
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-sunny, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-night, name: Switch to system preference }
nav:
  - Home: index.md
  - Showcase: showcase.md
  - Getting started: getting-started.md
  - Widget catalog:
      - Overview: widgets.md
      # BEGIN widget pages (js/scripts/widget-pages.mjs)
      - Controls, continuous:
          - Knob: widgets/knob.md
          - Dial: widgets/dial.md
          - FillSlide: widgets/fill-slide.md
          - NumericEntry: widgets/numeric-entry.md
      - Controls, discrete:
          - PushButton: widgets/push-button.md
          - ToggleSwitch: widgets/toggle-switch.md
          - RockerSwitch: widgets/rocker-switch.md
          - SlideSwitch: widgets/slide-switch.md
          - SelectorSwitch: widgets/selector-switch.md
          - EmergencyStop: widgets/emergency-stop.md
      - Indicators, analog:
          - Gauge: widgets/gauge.md
          - Meter: widgets/meter.md
          - VUMeter: widgets/vu-meter.md
          - Tank: widgets/tank.md
          - Thermometer: widgets/thermometer.md
          - SevenSegment: widgets/seven-segment.md
          - Compass: widgets/compass.md
          - AnalogIndicator: widgets/analog-indicator.md
      - Indicators, discrete:
          - LED: widgets/led.md
          - StackLight: widgets/stack-light.md
          - BitField: widgets/bit-field.md
      - Graphs, time:
          - WaveformChart: widgets/waveform-chart.md
          - IntensityChart: widgets/intensity-chart.md
          - DigitalWaveformGraph: widgets/digital-waveform-graph.md
          - MixedSignalGraph: widgets/mixed-signal-graph.md
      - Graphs, trends:
          - TrendChart: widgets/trend-chart.md
          - Sparkline: widgets/sparkline.md
      - Compact indicators:
          - DeviationIndicator: widgets/deviation-indicator.md
          - BarGraph: widgets/bar-graph.md
          - KPITile: widgets/kpi-tile.md
      - Graphs, specialized:
          - PolarPlot: widgets/polar-plot.md
          - SmithChart: widgets/smith-chart.md
          - RadarChart: widgets/radar-chart.md
          - PictureControl: widgets/picture-control.md
      - Alarms and events:
          - AlarmIndicator: widgets/alarm-indicator.md
          - AlarmBanner: widgets/alarm-banner.md
          - AlarmList: widgets/alarm-list.md
          - Annunciator: widgets/annunciator.md
          - EventLog: widgets/event-log.md
      - Process symbols:
          - Valve: widgets/valve.md
          - Pump: widgets/pump.md
          - Motor: widgets/motor.md
          - Pipe: widgets/pipe.md
      - Field instruments:
          - Transmitter: widgets/transmitter.md
      - Supervisory objects:
          - PIDFaceplate: widgets/pid-faceplate.md
          - StateMachine: widgets/state-machine.md
      - Recipes and plant structure:
          - RecipeTable: widgets/recipe-table.md
          - XYGraph: widgets/xy-graph.md
          - EquipmentTree: widgets/equipment-tree.md
      - Custom front panels:
          - SvgPanel: widgets/svg-panel.md
      - Layout and session:
          - SynopticCanvas: widgets/synoptic-canvas.md
          - ThemeSwitch: widgets/theme-switch.md
      # END widget pages
  - Examples: examples.md
  - Try it in the browser: try.md
  - Safety notice: safety.md
  - Standards and references: standards.md
  - Guides:
      - Alarm conventions: alarm-conventions.md
      - Hosts and liveness: hosts.md
      - Trait contract for host authors: trait-contract.md
  - API reference: api.md
  - Specification: specification.md
  - Development:
      - Development guide: development.md
      - Front-end migration inventory: dev/frontend-migration-inventory.md
  - Requirements status: requirements-status.md
  - License and citation: citing.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: numpy
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }
